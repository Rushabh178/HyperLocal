spring.application.name=app
# No default profile. Local development sets SPRING_PROFILES_ACTIVE=dev (fake payments that honour
# X-Fake-Payment, logged pushes). Without dev, startup fails unless a real PaymentGateway and PushSender
# are configured, e.g. SPRING_PROFILES_ACTIVE=prod,razorpay,fcm.
# Secrets come from environment variables; a local ./.env file (see .env.example) is loaded too.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hyper_local}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# After Hibernate creates/updates tables, run db/indexes.sql (GiST + partial indexes JPA can't declare).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/indexes.sql
# ---------------------------------------------------------------------------
# Security / Auth
# ---------------------------------------------------------------------------
# HS256 signing key for access tokens (Base64, >= 32 bytes). Required: set JWT_SECRET.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=hyperlocal-api
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=30d

app.otp.length=6
app.otp.ttl=5m
app.otp.max-attempts=5
app.otp.resend-cooldown=30s
# "log" prints OTPs to the server log (development only). Plug in an SMS provider before going live.
app.otp.provider=log
# "dev" profile only: approve new stores and delivery partners automatically (no ops review, no KYC).
# Ignored without "dev", so it can never skip reviews in a real deployment.
app.dev.auto-approve=${DEV_AUTO_APPROVE:false}

# ---------------------------------------------------------------------------
# Operational constants (from the architecture blueprint)
# ---------------------------------------------------------------------------
app.ops.batching-corridor-meters=500
app.ops.batching-max-added-delay=4m
app.ops.kirana-broadcast-radius-meters=500
app.ops.kirana-broadcast-fanout=5
app.ops.kirana-claim-timeout=60s
app.ops.kirana-broadcast-max-rounds=2
app.ops.kirana-broadcast-combined-delay=2m
app.ops.rider-search-radius-meters=3000
app.ops.rider-offer-timeout=30s
app.ops.rider-base-pay=30
app.ops.rider-multi-stop-bonus=10
# How often the dispatch poller advances broadcast rounds, expires offers and retries waiting orders.
app.dispatch.poll-interval-ms=5000
app.ops.h3-resolution=9
app.ops.grocery-cart-nudge-threshold=150
app.ops.batch-injection-bonus=15
app.ops.default-prep-minutes=15
# Bill: one courier, so one delivery fee + one flat convenience fee; no grocery minimum.
# delivery-fee is the small-grocery-cart fee inside the free-delivery zone (see app.delivery.*).
app.ops.delivery-fee=25
app.ops.convenience-fee=10
app.ops.food-tax-rate=0.05

# ---------------------------------------------------------------------------
# Delivery range and pricing (delivery/DeliveryPricing).
# Visibility is the straight line from the delivery address to the store. The fee distance of the order's
# farthest pickup is measured on fee-distance-basis (STRAIGHT_LINE, or ROAD via RoutingClient): free up to
# free-delivery-km, then the slab "fromKm-toKm:fee". Cards, menu and cart show that same distance.
# Inside the free zone a grocery-only cart under app.ops.grocery-cart-nudge-threshold still pays
# app.ops.delivery-fee unless it adds a meal (the meal nudge); beyond it every order pays its slab.
# ---------------------------------------------------------------------------
app.delivery.restaurant-radius-km=6
app.delivery.kirana-radius-km=2
app.delivery.free-delivery-km=2
app.delivery.fee-slabs=2-3:15,3-4:25,4-5:35,5-6:45
app.delivery.meal-nudge-radius-km=2
app.delivery.fee-distance-basis=STRAIGHT_LINE

# Rider pay: app.ops.rider-base-pay per order + per-km-rate for every km of the order's route
# (pickups -> drop) beyond distance-pay-after-km, booked as a DISTANCE earning.
app.rider.per-km-rate=5
app.rider.distance-pay-after-km=2

# ---------------------------------------------------------------------------
# Routing (RoutingClient). Default: straight line x 1.3 at 20 km/h.
# Run with the "osrm" profile and set OSRM_BASE_URL to use a self-hosted OSRM server.
# ---------------------------------------------------------------------------
app.routing.detour-factor=1.3
app.routing.average-speed-kmph=20
app.routing.osrm-base-url=${OSRM_BASE_URL:http://localhost:5000}

# ---------------------------------------------------------------------------
# Payments. The "dev" profile uses the fake gateway (auto-approves holds); "razorpay" uses the Razorpay
# skeleton. Set PAYMENT_WEBHOOK_SECRET in every non-dev environment.
# ---------------------------------------------------------------------------
app.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:dev-only-webhook-secret}
app.payment.hold-ttl=10m
# Fake gateway (dev without "razorpay"): SUCCESS | PENDING | FAIL. A request can override it with the
# header X-Fake-Payment.
payments.fake.default-outcome=SUCCESS
app.payment.razorpay.base-url=https://api.razorpay.com/v1
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# ---------------------------------------------------------------------------
# First ops admin, created on startup if ADMIN_EMAIL has no admin yet.
# ---------------------------------------------------------------------------
app.admin.seed-email=${ADMIN_EMAIL:}
app.admin.seed-password=${ADMIN_PASSWORD:}
app.admin.seed-name=${ADMIN_NAME:Ops Admin}

# ---------------------------------------------------------------------------
# File storage (KYC documents). Default: local disk, served by this app.
# ---------------------------------------------------------------------------
app.storage.local-dir=${STORAGE_DIR:./uploads}
app.storage.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
